apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: genie-us-be

replicas:
  - name: genie-us-permission-service
    count: 2

resources:
  - ../../base
  - configmap.yaml
  - secret.yaml

patches:
  - path: deployment.yaml

images:
  - name: genie-us-permission-service
    newName: harbor.jtchinae-bank.co.kr/jtcsb/genie-us-permission-service
    newTag: "3681f2c"

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: genie-us-permission-service
      spec:
        template:
          spec:
            containers:
              - name: genie-us-permission-service
                volumeMounts:
                  - name: board-file
                    mountPath: /board_file
            volumes:
              - name: board-file
                persistentVolumeClaim:
                  claimName: board-file-pvc