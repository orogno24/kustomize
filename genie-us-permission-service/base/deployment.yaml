apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-us-permission-service
  namespace: genie-us-be
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: genie-us-permission-service
  template:
    metadata:
      labels:
        app: genie-us-permission-service
    spec:
      containers:
        - name: genie-us-permission-service
          image: genie-us-permission-service:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: board-file
              mountPath: /board_file
      volumes:
        - name: board-file
          persistentVolumeClaim:
            claimName: board-file-pvc
