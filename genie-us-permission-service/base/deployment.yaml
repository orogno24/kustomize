apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-us-permission
  namespace: genie-us-permission
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genie-us-permission
  template:
    metadata:
      labels:
        app: genie-us-permission
    spec:
      containers:
        - name: genie-us-permission
          image: genie-us-permission:latest
          ports:
            - containerPort: 8080
