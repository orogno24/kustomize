apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-us-fe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genie-us-fe
  template:
    metadata:
      labels:
        app: genie-us-fe
    spec:
      containers:
        - name: genie-us-fe
          image: genie-us-fe:latest
          ports:
            - containerPort: 80
          env:
          - name: NODE_ENV
            value: dev