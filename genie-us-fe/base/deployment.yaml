apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-us-fe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genie-us-fe
  template:
    metadata:
      labels:
        app: genie-us-fe
    spec:
      containers:
        - name: genie-us-fe
          image: genie-us-fe:latest
          ports:
            - containerPort: 80
          env:
          - name: API_PROXY_URL
            value: "https://api.jtchinae-bank.co.kr"
          - name: VITE_API_BASE_URL
            value: "/api"