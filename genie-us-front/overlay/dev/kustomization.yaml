apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: genie-us-fe

replicas:
  - name: genie-us-front-service
    count: 2

resources:
  - ../../base

images:
  - name: genie-us-front-service
    newName: harbor.jtchinae-bank.co.kr/jtcsb/genie-us-front
    newTag: "e4a76f0"

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: genie-us-front-service
      spec:
        template:
          spec:
            containers:
              - name: genie-us-front-service
                volumeMounts:
                  - name: board-file
                    mountPath: /board_file
            volumes:
              - name: board-file
                persistentVolumeClaim:
                  claimName: board-file-pvc