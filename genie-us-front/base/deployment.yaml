apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-us-front-service
  namespace: genie-us-fe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genie-us-front-service
  template:
    metadata:
      labels:
        app: genie-us-front-service
    spec:
      containers:
        - name: genie-us-front-service
          image: genie-us-front-service:latest
          ports:
            - containerPort: 80
