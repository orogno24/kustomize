apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-us-front
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genie-us-front
  template:
    metadata:
      labels:
        app: genie-us-front
    spec:
      containers:
        - name: genie-us-front
          image: genie-us-front:latest
          ports:
            - containerPort: 80
