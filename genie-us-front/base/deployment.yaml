apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-us-front-service
  namespace: genie-us-fe
spec:
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: genie-us-front-service
  template:
    metadata:
      labels:
        app: genie-us-front-service
    spec:
      containers:
        - name: genie-us-front-service
          image: genie-us-front-service:latest
          ports:
            - containerPort: 80
          env:
            - name: API_PROXY_URL
              value: "https://api.jtchinae-bank.co.kr"
            - name: VITE_API_BASE_URL
              value: "/api"
          volumeMounts:
            - name: board-file
              mountPath: /board_file
      volumes:
        - name: board-file
          persistentVolumeClaim:
            claimName: board-file-pvc
