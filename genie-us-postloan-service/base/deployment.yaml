apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-us-postloan
  namespace: genie-us-be
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genie-us-postloan
  template:
    metadata:
      labels:
        app: genie-us-postloan
    spec:
      containers:
        - name: genie-us-postloan
          image: genie-us-postloan:latest
          ports:
            - containerPort: 8080
