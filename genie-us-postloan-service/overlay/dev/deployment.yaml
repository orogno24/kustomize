apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-us-postloan-service
  namespace: genie-us-be
spec:
  template:
    spec:
      containers:
        - name: genie-us-postloan-service
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
          volumeMounts:
            - mountPath: /board_file
              name: board
      volumes:
        - name: board
          persistentVolumeClaim:
            claimName: genie-us-postloan-service-pvc