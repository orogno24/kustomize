apiVersion: apps/v1
kind: Deployment
metadata:
  name: afterloan
spec:
  replicas: 1
  selector:
    matchLabels:
      app: afterloan
  template:
    metadata:
      labels:
        app: afterloan
    spec:
      containers:
        - name: afterloan
          image: afterloan:latest
          ports:
            - containerPort: 80
