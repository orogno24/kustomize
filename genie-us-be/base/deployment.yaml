apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-us-be
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genie-us-be
  template:
    metadata:
      labels:
        app: genie-us-be
    spec:
      containers:
        - name: genie-us-be
          image: genie-us-be:latest
          ports:
            - containerPort: 8080
          env:
          - name: SPRING_PROFILES_ACTIVE
            value: dev
