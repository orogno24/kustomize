apiVersion: apps/v1
kind: Deployment
metadata:
  name: soundness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soundness
  template:
    metadata:
      labels:
        app: soundness
    spec:
      containers:
        - name: soundness
          image: soundness:latest
          ports:
            - containerPort: 80
