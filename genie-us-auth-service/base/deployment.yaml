apiVersion: apps/v1
kind: Deployment
metadata:
  name: genie-us-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: genie-us-auth
  template:
    metadata:
      labels:
        app: genie-us-auth
    spec:
      containers:
        - name: genie-us-auth
          image: genie-us-auth:latest
          ports:
            - containerPort: 8080
